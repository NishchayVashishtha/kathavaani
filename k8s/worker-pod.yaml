apiVersion: v1
kind: Pod
metadata:
  name: kathavaani-worker
  namespace: dgx-s-bmu-soet-230737-restricted
  labels:
    app: kathavaani
spec:
  restartPolicy: Always
  volumes:
  - name: workspace-vol
    hostPath:
      path: /home/dgx-s-bmu-soet-230737
      type: Directory
  containers:
  - name: worker
    image: pytorch/pytorch:2.4.0-cuda12.4-cudnn9-runtime
    workingDir: /workspace/kathavaani
    command: ["sleep", "infinity"]
    ports:
    - containerPort: 8000
      name: http
    env:
    - name: HF_HOME
      value: /tmp/hf_cache
    - name: TORCH_HOME
      value: /tmp/torch_cache
    - name: XDG_CACHE_HOME
      value: /tmp/.cache
    - name: PYTHONPATH
      value: /workspace/kathavaani
    volumeMounts:
    - name: workspace-vol
      mountPath: /workspace
    resources:
      limits:
        nvidia.com/mig-1g.18gb: 1
        cpu: "8"
        memory: "24Gi"
      requests:
        nvidia.com/mig-1g.18gb: 1
        cpu: "4"
        memory: "16Gi"
